# Eunaria workspace map: clients and the Notion databases the AI employees may use.
#
# Mapped from the Phase 1 audit of the "Justine Janerol's Notion" workspace (2026-10-11).
# Values are Notion *database* IDs; the Notion adapter resolves each to its data source
# at runtime. Prefix a value with "ds:" to give a data source ID directly.
#
# Client separation: an agent working on a task for client X can only read and write
# the databases listed under [clients.X] (plus [shared] for Eunaria-internal tasks).
#
# Missing roles are noted inline. Databases marked "TO CREATE" are proposed in
# docs/NOTION_SCHEMA.md and are only created after the owner approves.

